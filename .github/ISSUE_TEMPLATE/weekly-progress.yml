name: "週次報告"
description: "月曜日に今週の目標を設定し、金曜日に成果と課題を振り返ります"
title: "[進捗報告] "
labels:
  - "weekly"
projects:
  - "YokoyamaLab/16"

body:
  - type: markdown
    attributes:
      value: |
        # Weekly Research Progress

        このIssueは、月曜日に今週の目標を設定し、金曜日に成果と課題を振り返るための週次記録です。

        - 横山研進捗管理プロジェクトでは Scope を `Weekly` とします。
        - このIssueだけ週次の Iteration を割り当てます。
        - 月曜日: 今週の目標と成果物を記入してください。
        - **実際の研究作業は先に個別Issueを作り、このWeeklyにはIssue番号と「今週の到達点」を書いてください。**
        - Weeklyのチェック項目を後からIssueへ変換する運用は行いません。
        - 金曜日: 実際の成果、未完了事項、成果物へのリンク、次週の課題を追記してください。
        - Paper Surveyは作成時のWeeklyのSub-issueとして管理し、未完了の場合は翌週Weeklyへリンクのみ自動持ち越しします。親Weeklyは付け替えません。
        - 詳細は https://github.com/YokoyamaLab/Lab_Management/blob/main/WORKFLOW.md を参照してください。

  - type: input
    id: week
    attributes:
      label: "Week"
      description: "この週の月曜日の日付を YYYY-MM-DD で入力してください"
      placeholder: "2026-09-07"
    validations:
      required: true

  - type: textarea
    id: carry-over
    attributes:
      label: "先週からの持ち越し"
      description: "前週から継続する作業がある場合は、前週のIssueや継続する個別Issueへのリンクとともに記入してください。未完了Paper Surveyは中央自動化が別の『自動持ち越し』欄へ追加します。"
      placeholder: |
        Previous issue: #123

        - 継続する作業
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## Monday — Plan

  - type: textarea
    id: goals
    attributes:
      label: "今週の目標"
      description: "金曜日に達成できたか判断できる具体的な目標を書いてください"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: "金曜日に確認できる成果物"
      description: "先に作成した研究タスク・論文調査・論文執筆等のIssue番号と、今週金曜日までの具体的な到達点を書いてください。『#123 を進める』ではなく、達成判定できる状態を書きます。"
      value: |
        - [ ] #123 今週金曜日までの具体的な到達点
        - [ ] #124 今週金曜日までの具体的な到達点
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: activity
    attributes:
      label: "今週の主な活動"
      multiple: true
      options:
        - "Implementation / 実装"
        - "Experiment / 実験"
        - "Data analysis / データ分析"
        - "Paper writing / 論文執筆"
        - "Literature review / 文献調査"
        - "Design / 設計"
        - "Dataset preparation / データ準備"
        - "Presentation / 発表準備"
        - "Environment setup / 環境構築"
        - "Other / その他"
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: "懸念・障害・相談事項"
      description: "技術的な障害、判断に迷っていること、教員に相談したいことを書いてください"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## Friday — Result

        以下は金曜日のレビュー前にIssue本文を編集して更新してください。
        ゼミを欠席する場合も、金曜日12:50までを目安に通常どおり更新してください。

  - type: textarea
    id: seminar-attendance
    attributes:
      label: "ゼミ出欠・欠席時の連絡"
      description: "金曜日のゼミ前に更新してください。欠席理由は簡潔で構いません。欠席時は教員に確認してほしいことも書いてください。"
      value: |
        ### ゼミ出欠
        - [ ] 出席
        - [ ] 欠席

        ### 欠席時の連絡・相談
        欠席理由（簡潔で可）:

        教員に確認してほしいこと:
        -
    validations:
      required: false

  - type: textarea
    id: friday-result
    attributes:
      label: "金曜日時点の結果"
      value: |
        ### 完了したこと

        -

        ### 完了しなかったこと

        -

        ### 当初の計画から変更したこと

        -

        ### 分かったこと・得られた知見

        -
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: "成果物・Evidence"
      description: "PR、commit、論文、実験結果などのURLを記入してください"
      value: |
        ### Pull Request
        -

        ### Commits
        -

        ### Paper / Document
        -

        ### Experiment / Results
        -

        ### Other
        -
    validations:
      required: false

  - type: textarea
    id: next-week
    attributes:
      label: "次週への課題"
      description: "今週の結果を踏まえて、次に行うべきことを書いてください"
      value: |
        -
    validations:
      required: false

  - type: textarea
    id: reflection
    attributes:
      label: "振り返り"
      value: |
        ### うまくいったこと
        -

        ### 難しかったこと
        -

        ### 改善したいこと
        -
    validations:
      required: false
